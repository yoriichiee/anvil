<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Settings · Acme Notes</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/settings.js"></script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="wrap narrow" id="main">
    <div class="page-head">
      <div><h1>Workspace settings</h1><p>These apply to everyone in the workspace.</p></div>
    </div>
    <div id="content"><p class="loading" aria-live="polite">Loading settings…</p></div>
    <form class="card" id="form" hidden novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="workspace">Workspace name</label>
          <input id="workspace" name="workspace" type="text" maxlength="60" required>
        </div>
        <div class="field">
          <label for="reply_to">Reply-to email</label>
          <input id="reply_to" name="reply_to" type="email" placeholder="team@acme.example" autocomplete="off">
          <span class="help">Where replies to note e-mails go.</span>
        </div>
        <div class="field">
          <label for="default_visibility">New notes are visible to</label>
          <select id="default_visibility" name="default_visibility">
            <option value="team">The team only</option>
            <option value="guests">The team and guests</option>
          </select>
        </div>
        <div class="field">
          <label for="retention_days">Keep deleted notes for</label>
          <select id="retention_days" name="retention_days">
            <option value="30">30 days</option>
            <option value="90">90 days</option>
            <option value="365">1 year</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="check" for="weekly_digest"><input id="weekly_digest" name="weekly_digest" type="checkbox">
          <span>Weekly digest<span class="help">Send everyone a Monday summary of new and changed notes.</span></span></label>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit" id="save">Save settings</button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
</body>
</html>
