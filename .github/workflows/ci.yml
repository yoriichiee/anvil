name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: node --check on every .mjs
        run: |
          set -e
          find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --check dashboard/app.js
      - name: unit tests
        run: npm test
