<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Settings · Acme Notes (static snapshot)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/snapshot.css">
  <script src="assets/js/settings-snapshot.js" defer></script>
</head>
<body>
  <aside class="snap" aria-label="About this page"><div class="snap-in"><a class="snap-brand" href="../" aria-label="Anvil home"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 4.5H22.5V9H19L16.5 13.5H19L21.5 19.5H6.5L9 13.5H12L10.5 9C7 9 3.8 7.8 1 5.6C3.3 4.9 5.6 4.5 8 4.5Z"/></svg>Anvil</a><b>STATIC SNAPSHOT</b><span>Signed in as an admin. Seed data, nothing saves.</span><a class="snap-back" href="./">About this snapshot</a></div></aside>
  <header class="topbar" id="topbar"><div class="topbar-inner">
    <a class="brand" href="settings.html"><span class="brand-mark" aria-hidden="true"></span><span>Acme Notes <small>Acme Inc</small></span></a>
    <nav class="nav" aria-label="Main"><a href="./#why-static">Dashboard</a><a href="./#why-static">Team</a><a href="settings.html" aria-current="page">Settings</a></nav>
    <div class="user">
      <div class="user-name">Alex Doe<span>admin</span></div>
      <span class="avatar u1 " aria-hidden="true">AD</span>
      <a class="signout" href="./">Sign out</a>
    </div></div></header>
  <main class="wrap narrow" id="main">
    <div class="page-head">
      <div><h1>Workspace settings</h1><p>These apply to everyone in the workspace.</p></div>
    </div>
    <form class="card" id="form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="workspace">Workspace name</label>
          <input id="workspace" name="workspace" type="text" maxlength="60" required value="Acme Inc">
        </div>
        <div class="field">
          <label for="reply_to">Reply-to email</label>
          <input id="reply_to" name="reply_to" type="email" placeholder="team@acme.example" autocomplete="off" value="">
          <span class="help">Where replies to note e-mails go.</span>
        </div>
        <div class="field">
          <label for="default_visibility">New notes are visible to</label>
          <select id="default_visibility" name="default_visibility">
            <option value="team" selected>The team only</option>
            <option value="guests">The team and guests</option>
          </select>
        </div>
        <div class="field">
          <label for="retention_days">Keep deleted notes for</label>
          <select id="retention_days" name="retention_days">
            <option value="30">30 days</option>
            <option value="90" selected>90 days</option>
            <option value="365">1 year</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="check" for="weekly_digest"><input id="weekly_digest" name="weekly_digest" type="checkbox" checked>
          <span>Weekly digest<span class="help">Send everyone a Monday summary of new and changed notes.</span></span></label>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit" id="save">Save settings</button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
</body>
</html>
